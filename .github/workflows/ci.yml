name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phpize
          coverage: none

      - name: Configure
        run: |
          phpize
          ./configure --enable-pseudoglobals

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        env:
          NO_INTERACTION: '1'
          REPORT_EXIT_STATUS: '1'
        run: make test TESTS="-q"
